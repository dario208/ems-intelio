services:

  # ── InfluxDB 2.7 — base de données métriques temps réel ───────────────
  influxdb:
    image: influxdb:2.7-alpine
    container_name: ems-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE:         setup
      DOCKER_INFLUXDB_INIT_USERNAME:     admin
      DOCKER_INFLUXDB_INIT_PASSWORD:     admin_password
      DOCKER_INFLUXDB_INIT_ORG:         ems
      DOCKER_INFLUXDB_INIT_BUCKET:      intelineo
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ems-influx-token-secret
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - ems-net
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Telegraf — collecteur Modbus → InfluxDB (polling 1 s) ─────────────
  # network_mode: host — Telegraf utilise le réseau de l'hôte directement,
  # ce qui lui permet d'atteindre l'InteliNeo 5500 (192.168.1.100:502)
  # sans passer par le bridge Docker. L'URL InfluxDB devient localhost:8086.
  telegraf:
    image: telegraf:1.30-alpine
    container_name: ems-telegraf
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    network_mode: host

  # ── PostgreSQL — base de données relationnelle (fallback + commandes) ──
  postgres:
    image: postgres:16-alpine
    container_name: ems-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB:       genset_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ems-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d genset_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI — API REST + collecte fallback ─────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ems-fastapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:  "postgresql+psycopg2://postgres:password@postgres:5432/genset_db"
      INFLUX_URL:    "http://influxdb:8086"
      INFLUX_TOKEN:  "ems-influx-token-secret"
      INFLUX_ORG:    "ems"
      INFLUX_BUCKET: "intelineo"
      MODBUS_HOST:   "${MODBUS_HOST:-192.168.1.100}"
      MODBUS_PORT:   "${MODBUS_PORT:-502}"
    networks:
      - ems-net
    extra_hosts:
      - "intelineo:${MODBUS_HOST:-192.168.1.100}"

  # ── Grafana — dashboards temps réel ───────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: ems-grafana
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS:         ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - ems-net

volumes:
  postgres_data:
  influxdb_data:
  influxdb_config:
  grafana_data:

networks:
  ems-net:
    driver: bridge
