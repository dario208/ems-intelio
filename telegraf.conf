# telegraf.conf — Collecteur Modbus TCP → InfluxDB 2.x
# InteliNeo 5500 — Système hybride (Réseau · BESS · PV · Disjoncteurs)
#
# ⚠️  Adresses registres issues de IN5500.txt (Table: Values, format 2.3)
#     Adresses PDU 0-based (MODBUS_ADDRESS_OFFSET = 0)

# ── Agent global ──────────────────────────────────────────────────────
[agent]
  interval            = "1s"
  round_interval      = true
  metric_batch_size   = 1000
  metric_buffer_limit = 10000
  collection_jitter   = "0s"
  flush_interval      = "5s"
  flush_jitter        = "0s"
  precision           = "1s"
  hostname            = "ems-telegraf"
  omit_hostname       = false

# ── Sortie — InfluxDB 2.x ─────────────────────────────────────────────
[[outputs.influxdb_v2]]
  urls         = ["http://influxdb:8086"]
  token        = "ems-influx-token-secret"
  organization = "ems"
  bucket       = "intelineo"
  timeout      = "5s"

# ── Entrée — Modbus TCP InteliNeo 5500 ────────────────────────────────
[[inputs.modbus]]
  name              = "intelineo5500"
  controller        = "tcp://192.168.1.100:502"
  slave_id          = 1
  timeout           = "3s"
  busy_retries      = 3
  busy_retries_wait = "200ms"

  # ── Réseau (Mains/Bus) ─────────────────────────────────────────────
  # voltage    : UINT16  scale=1.0   → V
  # frequency  : INT32   scale=0.001 → Hz  (2 registres : 1074 + 1075)
  # mains_kw   : INT16   scale=0.1   → kW
  # mains_kvar : INT16   scale=0.1   → kVAr
  [[inputs.modbus.request]]
    slave_id   = 1
    byte_order = "ABCD"
    register   = "holding"
    fields = [
      { address=1076, name="voltage",    type="UINT16", scale=1.0   },
      { address=1074, name="frequency",  type="INT32",  scale=0.001 },
      { address=1085, name="mains_kw",   type="INT16",  scale=0.1   },
      { address=1086, name="mains_kvar", type="INT16",  scale=0.1   },
    ]
    [inputs.modbus.request.tags]
      measurement = "mains"
      source      = "intelineo5500"

  # ── BESS (Batterie) ────────────────────────────────────────────────
  # bess_kw        : INT16   scale=0.1 → kW
  # bess_kvar      : INT16   scale=0.1 → kVAr
  # bess_soc       : UINT16  scale=1.0 → %
  # bess_state_idx : UINT16  scale=1.0 → index état
  [[inputs.modbus.request]]
    slave_id   = 1
    byte_order = "ABCD"
    register   = "holding"
    fields = [
      { address=1000, name="bess_kw",        type="INT16",  scale=0.1 },
      { address=1004, name="bess_kvar",       type="INT16",  scale=0.1 },
      { address=1031, name="bess_soc",        type="UINT16", scale=1.0 },
      { address=1191, name="bess_state_idx",  type="UINT16", scale=1.0 },
    ]
    [inputs.modbus.request.tags]
      measurement = "bess"
      source      = "intelineo5500"

  # ── PV Solaire ─────────────────────────────────────────────────────
  # pv_kw   : INT16  scale=0.1 → kW
  # pv_kvar : INT16  scale=0.1 → kVAr
  [[inputs.modbus.request]]
    slave_id   = 1
    byte_order = "ABCD"
    register   = "holding"
    fields = [
      { address=1040, name="pv_kw",   type="INT16", scale=0.1 },
      { address=1041, name="pv_kvar", type="INT16", scale=0.1 },
    ]
    [inputs.modbus.request.tags]
      measurement = "pv"
      source      = "intelineo5500"

  # ── Disjoncteurs (Binary16 brut — extraction des bits dans Flux/Python)
  # log_bout_2_raw (1257) : bit 11 = MCB Status
  # log_bout_3_raw (1258) : bit  4 = BCB Status · bit 11 = PVCB Status
  # log_bout_4_raw (1259) : bit  3 = Any GCB Closed
  [[inputs.modbus.request]]
    slave_id   = 1
    byte_order = "ABCD"
    register   = "holding"
    fields = [
      { address=1257, name="log_bout_2_raw", type="UINT16", scale=1.0 },
      { address=1258, name="log_bout_3_raw", type="UINT16", scale=1.0 },
      { address=1259, name="log_bout_4_raw", type="UINT16", scale=1.0 },
    ]
    [inputs.modbus.request.tags]
      measurement = "breakers"
      source      = "intelineo5500"