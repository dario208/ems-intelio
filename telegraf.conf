# telegraf.conf — Collecteur Modbus TCP → InfluxDB 2.x
# InteliNeo 5500 — System hybride (Réseau · BESS · PV · Disjoncteurs)
#
# ⚠️  Toutes les adresses de registres viennent de IN5500.txt (Table: Values, format 2.3)
#     Adresses PDU 0-based (MODBUS_ADDRESS_OFFSET = 0 dans config.py)
#     Vérifier impérativement dans votre Modbus Map exportée depuis InteliConfig Neo.

# ── Agent global ──────────────────────────────────────────────────────
[agent]
  interval         = "1s"      # Polling toutes les 1 seconde
  round_interval   = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval   = "5s"
  flush_jitter     = "0s"
  precision        = "1s"
  hostname         = "ems-telegraf"
  omit_hostname    = false

# ── Sortie — InfluxDB 2.x ─────────────────────────────────────────────
[[outputs.influxdb_v2]]
  urls         = ["http://influxdb:8086"]
  token        = "ems-influx-token-secret"
  organization = "ems"
  bucket       = "intelineo"
  timeout      = "5s"

# ── Entrée — Modbus TCP InteliNeo 5500 ────────────────────────────────
[[inputs.modbus]]
  name            = "intelineo5500"
  controller      = "tcp://192.168.1.100:502"
  slave_id        = 1
  timeout         = "3s"
  busy_retries      = 3
  busy_retries_wait = "200ms"

  # ── Réseau (Mains/Bus) ───────────────────────────────────────────────
  # ⚠️ Source : IN5500.txt Table: Values
  # REG_VOLTAGE   (01076) : Unsigned16  Dec=0    → V       (valeur directe)
  # REG_FREQUENCY (01074) : Integer32   Dec=3    → Hz      (×0.001, 2 registres)
  # REG_MAINS_KW  (01085) : Integer16   Dec=1    → kW      (×0.1)
  # REG_MAINS_KVAR(01086) : Integer16   Dec=1    → kVAr    (×0.1)
  holding_registers = [
    { measurement="mains",    name="voltage",       address=[1076],       data_type="UINT16",  scale=1.0   },
    { measurement="mains",    name="frequency",     address=[1074],       data_type="INT32",   scale=0.001 },
    { measurement="mains",    name="mains_kw",      address=[1085],       data_type="INT16",   scale=0.1   },
    { measurement="mains",    name="mains_kvar",    address=[1086],       data_type="INT16",   scale=0.1   },

    # ── BESS (Batterie) ─────────────────────────────────────────────────
    # ⚠️ Source : IN5500.txt Table: Values
    # REG_BESS_KW   (01000) : Integer16   Dec=1    → kW      (×0.1)
    # REG_BESS_KVAR (01004) : Integer16   Dec=1    → kVAr    (×0.1)
    # REG_BESS_SOC  (01031) : Unsigned8   Dec=0    → %       (valeur directe 0-100)
    # REG_BESS_STATE(01191) : List#3      Dec=0    → index   (0=Init…13=Offload)
    { measurement="bess",     name="bess_kw",       address=[1000],       data_type="INT16",   scale=0.1   },
    { measurement="bess",     name="bess_kvar",     address=[1004],       data_type="INT16",   scale=0.1   },
    { measurement="bess",     name="bess_soc",      address=[1031],       data_type="UINT16",  scale=1.0   },
    { measurement="bess",     name="bess_state_idx",address=[1191],       data_type="UINT16",  scale=1.0   },

    # ── PV Solaire ──────────────────────────────────────────────────────
    # ⚠️ Source : IN5500.txt Table: Values
    # REG_PV_KW   (01040) : Integer16   Dec=1    → kW      (×0.1)
    # REG_PV_KVAR (01041) : Integer16   Dec=1    → kVAr    (×0.1)
    { measurement="pv",       name="pv_kw",         address=[1040],       data_type="INT16",   scale=0.1   },
    { measurement="pv",       name="pv_kvar",        address=[1041],       data_type="INT16",   scale=0.1   },

    # ── Disjoncteurs (Binary16 — registres Log Bout) ────────────────────
    # ⚠️ Source : IN5500.txt Table: Values — Log Bout registers
    # REG_LOG_BOUT_2 (01257) : Binary#13 — bit 11 = MCB Status
    # REG_LOG_BOUT_3 (01258) : Binary#14 — bit  4 = BCB Status · bit 11 = PVCB Status
    # REG_LOG_BOUT_4 (01259) : Binary#15 — bit  3 = Any GCB Closed
    # Stockés en UINT16 brut ; l'extraction des bits se fait dans influx_reader.py / Flux
    { measurement="breakers", name="log_bout_2_raw", address=[1257],      data_type="UINT16",  scale=1.0   },
    { measurement="breakers", name="log_bout_3_raw", address=[1258],      data_type="UINT16",  scale=1.0   },
    { measurement="breakers", name="log_bout_4_raw", address=[1259],      data_type="UINT16",  scale=1.0   },
  ]
