# telegraf.conf — Collecteur Modbus TCP → InfluxDB 2.x
# InteliNeo 5500 — Système hybride (Réseau · BESS · PV · Disjoncteurs)
#
# ⚠️  Adresses registres issues de IN5500.txt (Table: Values, format 2.3)
#     Adresses PDU 0-based (MODBUS_ADDRESS_OFFSET = 0 dans config.py)

# ── Agent global ──────────────────────────────────────────────────────
[agent]
  interval            = "1s"
  round_interval      = true
  metric_batch_size   = 1000
  metric_buffer_limit = 10000
  collection_jitter   = "0s"
  flush_interval      = "5s"
  flush_jitter        = "0s"
  precision           = "1s"
  hostname            = "ems-telegraf"
  omit_hostname       = false

# ── Sortie — InfluxDB 2.x ─────────────────────────────────────────────
[[outputs.influxdb_v2]]
  # localhost car Telegraf utilise network_mode: host — pas de DNS Docker
  urls         = ["http://localhost:8086"]
  token        = "ems-influx-token-secret"
  organization = "ems"
  bucket       = "intelineo"
  timeout      = "5s"

# ── Entrée — Modbus TCP InteliNeo 5500 ────────────────────────────────
[[inputs.modbus]]
  name               = "intelineo5500"
  controller         = "tcp://192.168.1.100:502"
  slave_id           = 1
  timeout            = "3s"
  busy_retries       = 3
  busy_retries_wait  = "200ms"
  # "request" active les blocs [[inputs.modbus.request]] — OBLIGATOIRE
  # sans cette ligne Telegraf utilise le style "register" et ignore les requêtes
  configuration_type = "request"

  # ── Réseau (Mains/Bus) ─────────────────────────────────────────────
  # ⚠️ Source : IN5500.txt Table: Values
  # REG_FREQUENCY (01074) : Integer32  Dec=3 → Hz    (×0.001, 2 registres)
  # REG_VOLTAGE   (01076) : Unsigned16 Dec=0 → V     (valeur directe)
  # REG_MAINS_KW  (01085) : Integer16  Dec=1 → kW    (×0.1)
  # REG_MAINS_KVAR(01086) : Integer16  Dec=1 → kVAr  (×0.1)
  [[inputs.modbus.request]]
    slave_id   = 1
    byte_order = "ABCD"
    register   = "holding"
    fields = [
      { address=1076, name="voltage",    type="UINT16", scale=1.0,   measurement="mains" },
      { address=1074, name="frequency",  type="INT32",  scale=0.001, measurement="mains" },
      { address=1085, name="mains_kw",   type="INT16",  scale=0.1,   measurement="mains" },
      { address=1086, name="mains_kvar", type="INT16",  scale=0.1,   measurement="mains" },
    ]

  # ── BESS (Batterie) ────────────────────────────────────────────────
  # ⚠️ Source : IN5500.txt Table: Values
  # REG_BESS_KW   (01000) : Integer16  Dec=1 → kW    (×0.1)
  # REG_BESS_KVAR (01004) : Integer16  Dec=1 → kVAr  (×0.1)
  # REG_BESS_SOC  (01031) : Unsigned8  Dec=0 → %     (0-100 direct)
  # REG_BESS_STATE(01191) : List#3     Dec=0 → index (0=Init…13=Offload)
  [[inputs.modbus.request]]
    slave_id   = 1
    byte_order = "ABCD"
    register   = "holding"
    fields = [
      { address=1000, name="bess_kw",        type="INT16",  scale=0.1,  measurement="bess" },
      { address=1004, name="bess_kvar",       type="INT16",  scale=0.1,  measurement="bess" },
      { address=1031, name="bess_soc",        type="UINT16", scale=1.0,  measurement="bess" },
      { address=1191, name="bess_state_idx",  type="UINT16", scale=1.0,  measurement="bess" },
    ]

  # ── PV Solaire ─────────────────────────────────────────────────────
  # ⚠️ Source : IN5500.txt Table: Values
  # REG_PV_KW   (01040) : Integer16  Dec=1 → kW   (×0.1)
  # REG_PV_KVAR (01041) : Integer16  Dec=1 → kVAr (×0.1)
  [[inputs.modbus.request]]
    slave_id   = 1
    byte_order = "ABCD"
    register   = "holding"
    fields = [
      { address=1040, name="pv_kw",   type="INT16", scale=0.1, measurement="pv" },
      { address=1041, name="pv_kvar", type="INT16", scale=0.1, measurement="pv" },
    ]

  # ── Disjoncteurs (Binary16 brut) ────────────────────────────────────
  # ⚠️ Source : IN5500.txt — Log Bout registers
  # REG_LOG_BOUT_2 (01257) Binary#13 : bit 11 = MCB Status
  # REG_LOG_BOUT_3 (01258) Binary#14 : bit  4 = BCB Status · bit 11 = PVCB Status
  # REG_LOG_BOUT_4 (01259) Binary#15 : bit  3 = Any GCB Closed
  # Valeurs UINT16 brutes — extraction des bits dans influx_reader.py
  [[inputs.modbus.request]]
    slave_id   = 1
    byte_order = "ABCD"
    register   = "holding"
    fields = [
      { address=1257, name="log_bout_2_raw", type="UINT16", scale=1.0, measurement="breakers" },
      { address=1258, name="log_bout_3_raw", type="UINT16", scale=1.0, measurement="breakers" },
      { address=1259, name="log_bout_4_raw", type="UINT16", scale=1.0, measurement="breakers" },
    ]
